<!-- Splash Screen -->
<section id="splash-screen" class="splash-screen">

    <h1>WELCOME!</h1>

    <p class="splash-subtitle">
        I love you all and I wanted to better share some of my interests with you and hopefully make gift shopping easier and more fun this year! I hope you enjoy looking around and I will love anything that I get.
        If anything is broken, please don't hesitate to let me know!
    </p>

    <div class="menu-buttons">

        <button onclick="showAll()">View All</button>

        <button onclick="showBooks()">Books</button>

        <button onclick="showBoardGames()">Board Games</button>

        <button onclick="showOther()">Normal Gifts</button>

        <button onclick="showRandomOrder()">Shuffle Everything</button>

        <button onclick="showRandomCurrentItem()">Surprise Me!</button>

    </div>

</section>


<!-- Wishlist Display -->
<section id="wishlist-screen" style="display: none;">

    <button onclick="showMenu()" class="back-button">

    </button>

    <button id="shuffle-button" onclick="handleShuffle()" class="back-button">
        Shuffle
    </button>

    <div id="wishlist-grid" class="wishlist-grid"></div>

</section>
